<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola DNS — Clincoo Experiment</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="https://app.clincoo.buzz/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: ["class", ".dark-mode"] };</script>
<script src="https://unpkg.com/lucide@1.41.0"></script>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #ffffff; transition: background-color 0.3s ease, color 0.3s ease; }
    :root { --accent-color: #000000; --accent-hover: #1f2937; --accent-text: #ffffff; }
    .bg-accent { background-color: var(--accent-color) !important; }
    .text-accent { color: var(--accent-color) !important; }
    .border-accent { border-color: var(--accent-color) !important; }
    .hover\:bg-accent-hover:hover { background-color: var(--accent-hover) !important; }
    body.dark-mode { background-color: #000000; color: #ffffff; }
    body.dark-mode .bg-white { background-color: #0a0a0a !important; }
    body.dark-mode .bg-gray-50 { background-color: #141414 !important; }
    body.dark-mode .bg-gray-100 { background-color: #222222 !important; }
    body.dark-mode .border-gray-100, body.dark-mode .border-gray-200, body.dark-mode .border-gray-300 { border-color: #222222 !important; }
    body.dark-mode .text-accent { color: #ffffff !important; }
    body.dark-mode .text-gray-900, body.dark-mode .text-gray-800, body.dark-mode .text-black { color: #ffffff !important; }
    body.dark-mode .text-gray-700, body.dark-mode .text-gray-600, body.dark-mode .text-gray-500 { color: #888888 !important; }
    body.dark-mode .text-gray-400 { color: #666666 !important; }
    body.dark-mode .bg-accent { background-color: #ffffff !important; color: #000000 !important; }
    body.dark-mode .bg-accent.text-white { color: #000000 !important; }
    body.dark-mode .bg-accent.text-white svg { color: #000000 !important; stroke: #000000 !important; }
    body.dark-mode button[onclick="goBack()"] { background-color: #000000 !important; border: 1.5px solid rgba(255,255,255,0.4) !important; color: #ffffff !important; }
    body.dark-mode button[onclick="goBack()"]:hover { background-color: #1a1a1a !important; border-color: rgba(255,255,255,0.7) !important; }
    body.dark-mode button[onclick="goBack()"] svg { color: #ffffff !important; stroke: #ffffff !important; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    input:focus, select:focus, textarea:focus { outline: none!important; box-shadow: none!important; }
</style>
</head>
<body class="min-h-screen flex flex-col text-gray-900 pt-20">
<script>(function(){try{var t=localStorage.getItem('clinqoo_theme')||'Sistem (Default)';var d=(t==='Gelap')||(t==='Sistem (Default)'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.body.classList.add('dark-mode');var a=localStorage.getItem('clinqoo_accent')||'Hitam (Default)';var am={'Hitam (Default)':{m:'#000000',h:'#1f2937'},'Biru':{m:'#2563eb',h:'#1d4ed8'},'Hijau':{m:'#059669',h:'#047857'},'Ungu':{m:'#9333ea',h:'#7e22ce'},'Merah':{m:'#dc2626',h:'#b91c1c'}};var c=am[a]||am['Hitam (Default)'];document.documentElement.style.setProperty('--accent-color',c.m);document.documentElement.style.setProperty('--accent-hover',c.h);}catch(e){}})();</script>

<main class="flex-1 w-full max-w-3xl mx-auto pb-16 flex-col justify-start relative">
    <button onclick="goBack()" class="fixed top-3 left-3 w-10 h-10 flex items-center justify-center rounded-full bg-white backdrop-blur border border-gray-100 shadow-sm hover:bg-gray-50 transition-all cursor-pointer text-gray-700 hover:text-black z-50" aria-label="Kembali">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <div class="flex flex-col px-5 pb-2 relative">
        <h2 class="text-[24px] font-extrabold text-gray-900 tracking-tight">Kelola DNS</h2>
        <p id="v-domain" class="text-[14px] text-gray-500 font-medium mt-0.5">memuat…</p>
    </div>

    <div class="px-5">
        <div class="flex items-center justify-between mt-6">
            <h3 class="text-[12px] font-bold text-gray-400 uppercase tracking-wider">Record DNS</h3>
            <button onclick="openAddRecord()" class="bg-accent text-white text-[13px] font-semibold rounded-full px-3.5 py-1.5 cursor-pointer active:scale-95 transition-all">Tambah Record</button>
        </div>

        <div class="flex items-center gap-10 mt-3 mb-0.5">
            <span class="text-[10px] font-bold text-gray-300 uppercase tracking-widest shrink-0">Tipe</span>
            <span class="text-[10px] font-bold text-gray-300 uppercase tracking-widest shrink-0">Nama</span>
            <span class="text-[10px] font-bold text-gray-300 uppercase tracking-widest">Nilai</span>
            <span class="w-8 shrink-0"></span>
        </div>
        <div id="dns-list" class="divide-y divide-gray-100 border-t border-gray-100"></div>
    </div>
</main>

<!-- Modal tambah record -->
<div id="add-record-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[60] flex items-center justify-center p-5" onclick="if(event.target===this)closeAddRecord()">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-sm p-5">
        <h3 class="text-[15px] font-bold text-gray-900">Tambah Record DNS</h3>

        <div class="mt-4">
            <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Tipe Record</label>
            <div class="relative">
                <button id="dns-type-trigger" type="button" onclick="toggleTypePopover()" class="w-full flex items-center justify-between bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-[13px] font-semibold text-gray-900 cursor-pointer">
                    <span id="dns-type-label">A</span>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                </button>
                <div id="dns-type-popover" class="hidden absolute left-0 right-0 mt-1.5 bg-white border border-gray-200 rounded-lg shadow-lg z-[80] py-1 max-h-44 overflow-auto"></div>
            </div>
        </div>

        <div class="mt-4">
            <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Nama</label>
            <input id="dns-name" type="text" placeholder="@" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-[13px] font-medium text-gray-900 placeholder-gray-400">
        </div>

        <div class="mt-4">
            <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Nilai</label>
            <input id="dns-content" type="text" placeholder="192.0.2.1" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-[13px] font-medium text-gray-900 placeholder-gray-400">
        </div>

        <div class="flex justify-end gap-1 mt-5">
            <button onclick="closeAddRecord()" class="rounded-md px-3 py-1.5 text-[13px] font-semibold text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-colors cursor-pointer">Batal</button>
            <button onclick="addRecord()" class="rounded-md px-3 py-1.5 text-[13px] font-semibold text-accent hover:bg-gray-50 transition-colors cursor-pointer">Simpan</button>
        </div>
    </div>
</div>

<!-- Popover aksi record (titik tiga tiduran) -->
<div id="row-backdrop" class="hidden fixed inset-0 z-[55]" onclick="closeRowMenu()"></div>
<div id="row-menu" class="hidden fixed z-[60] bg-white rounded-xl shadow-xl py-1 w-40" style="top:0; left:0;">
    <div id="row-menu-list" class="flex flex-col"></div>
</div>

<script>
const domain = (new URLSearchParams(location.search).get('domain') || '').toLowerCase();

function goBack() { if (history.length > 1) history.back(); else location.href = '../../'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function storeKey(k) { return 'clincoo_exp_' + k + '_' + domain; }
function loadJSON(key, def) { try { return JSON.parse(localStorage.getItem(storeKey(key))) ?? def; } catch(e) { return def; } }
function saveJSON(key, val) { localStorage.setItem(storeKey(key), JSON.stringify(val)); }
function getSetting(k, def) { return localStorage.getItem(storeKey('set_' + k)) ?? def; }
function saveSetting(k, v) { localStorage.setItem(storeKey('set_' + k), v);  }
function paintToggle(btn, on) {
    btn.classList.toggle('bg-gray-200', !on);
    btn.classList.toggle('bg-accent', on);
    btn.innerHTML = '<span class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ' + (on ? 'left-[22px]' : 'left-0.5') + '"></span>';
}
function toggleSetting(key, btn) {
    const on = getSetting(key, 'off') === 'on';
    saveSetting(key, on ? 'off' : 'on');
    paintToggle(btn, !on);
}
function initToggles() {
    document.querySelectorAll('.setting-toggle').forEach(btn => {
        const key = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
        paintToggle(btn, getSetting(key, 'off') === 'on');
    });
}

function defaultRecords() {
    return [
        { id: 'r1', type: 'A', name: '@', content: '192.0.2.10' },
        { id: 'r2', type: 'CNAME', name: 'www', content: domain }
    ];
}
function renderDns() {
    let list = loadJSON('dns', null);
    if (!list) { list = defaultRecords(); saveJSON('dns', list); }
    document.getElementById('dns-list').innerHTML = list.length ? list.map(r => `
        <div class="flex items-center gap-10 py-3.5">
            <span class="mono text-[11px] font-bold text-gray-400 border border-gray-200 rounded px-1.5 py-1 shrink-0">${r.type}</span>
            <span class="mono text-[13px] font-semibold text-gray-900 truncate shrink-0">${esc(r.name)}</span>
            <span class="mono text-[12px] text-gray-500 truncate flex-1 min-w-0">${esc(r.content)}</span>
            <button onclick="openRowMenu(event, '${r.id}')" class="w-8 h-8 flex items-center justify-center cursor-pointer shrink-0 rounded-full hover:bg-gray-100 transition-colors" title="Aksi lainnya">
                <i data-lucide="more-horizontal" class="w-[18px] h-[18px] text-gray-400"></i>
            </button>
        </div>`).join('') : '<p class="text-[13px] text-gray-500 py-3">Belum ada record DNS.</p>';
    lucide.createIcons();
}
const DNS_TYPES = ['A', 'AAAA', 'CNAME', 'TXT', 'MX'];
function renderTypePopover() {
    const current = document.getElementById('dns-type-label').textContent;
    document.getElementById('dns-type-popover').innerHTML = DNS_TYPES.map(t => `
        <button type="button" onclick="selectDnsType('${t}')" class="w-full text-left px-3 py-2 text-[13px] font-semibold cursor-pointer transition-colors hover:bg-gray-50 ${t === current ? 'text-accent' : 'text-gray-800'}">${t}</button>`).join('');
}
function toggleTypePopover() {
    renderTypePopover();
    document.getElementById('dns-type-popover').classList.toggle('hidden');
}
function selectDnsType(t) {
    document.getElementById('dns-type-label').textContent = t;
    document.getElementById('dns-type-popover').classList.add('hidden');
}
document.addEventListener('click', (e) => {
    const pop = document.getElementById('dns-type-popover');
    const trigger = document.getElementById('dns-type-trigger');
    if (!pop || pop.classList.contains('hidden')) return;
    if (!pop.contains(e.target) && !trigger.contains(e.target)) pop.classList.add('hidden');
});
function openAddRecord() {
    document.getElementById('dns-type-label').textContent = 'A';
    document.getElementById('dns-type-popover').classList.add('hidden');
    document.getElementById('dns-name').value = '';
    document.getElementById('dns-content').value = '';
    const m = document.getElementById('add-record-modal');
    m.classList.remove('hidden'); m.classList.add('flex');
    lucide.createIcons();
    document.getElementById('dns-name').focus();
}
function closeAddRecord() {
    document.getElementById('dns-type-popover').classList.add('hidden');
    const m = document.getElementById('add-record-modal');
    m.classList.add('hidden'); m.classList.remove('flex');
}
function addRecord() {
    const type = document.getElementById('dns-type-label').textContent;
    const name = document.getElementById('dns-name').value.trim();
    const content = document.getElementById('dns-content').value.trim();
    if (!name || !content) {  return; }
    const list = loadJSON('dns', []);
    list.push({ id: 'r' + Date.now().toString(36), type, name, content });
    saveJSON('dns', list);
    closeAddRecord(); renderDns();
}
function openRowMenu(evt, id) {
    const r = loadJSON('dns', []).find(x => x.id === id); if (!r) return;
    document.getElementById('row-menu-list').innerHTML = `
        <button onclick="closeRowMenu(); copyRecordValue('${r.id}')" class="w-full text-left px-4 py-2.5 text-[13px] font-medium text-gray-800 cursor-pointer transition-colors hover:bg-gray-50">Salin Nilai</button>
        <button onclick="closeRowMenu(); deleteRecord('${r.id}')" class="w-full text-left px-4 py-2.5 text-[13px] font-semibold text-red-600 cursor-pointer transition-colors hover:bg-gray-50">Hapus</button>`;
    const menu = document.getElementById('row-menu');
    const backdrop = document.getElementById('row-backdrop');
    menu.classList.remove('hidden'); backdrop.classList.remove('hidden');
    const btn = evt.currentTarget.getBoundingClientRect();
    const menuW = menu.offsetWidth;
    let left = btn.right - menuW;
    if (left < 8) left = 8;
    if (left + menuW > window.innerWidth - 8) left = window.innerWidth - 8 - menuW;
    let top = btn.bottom + 6;
    const menuH = menu.offsetHeight;
    if (top + menuH > window.innerHeight - 8) top = btn.top - menuH - 6;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
}
function closeRowMenu() {
    document.getElementById('row-menu').classList.add('hidden');
    document.getElementById('row-backdrop').classList.add('hidden');
}
function copyRecordValue(id) {
    const r = loadJSON('dns', []).find(x => x.id === id);
    if (r) navigator.clipboard.writeText(r.content).catch(() => {});
}
function deleteRecord(id) {
    saveJSON('dns', loadJSON('dns', []).filter(r => r.id !== id));
    renderDns();
}
if (!domain) { location.replace('../../'); }
else {
    document.getElementById('v-domain').textContent = domain;
    renderDns();
    lucide.createIcons();
}
</script>
</body>
</html>
