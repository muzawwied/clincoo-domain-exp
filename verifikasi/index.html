<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Domain — Clincoo Experiment</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="https://app.clincoo.buzz/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: ["class", ".dark-mode"] };</script>
<script src="https://unpkg.com/lucide@1.41.0"></script>
<style>
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    body { font-family: 'Inter', sans-serif; background-color: #ffffff; transition: background-color 0.3s ease, color 0.3s ease; }
    :root { --accent-color: #000000; --accent-hover: #1f2937; --accent-text: #ffffff; }
    .bg-accent { background-color: var(--accent-color) !important; }
    .text-accent { color: var(--accent-color) !important; }
    .border-accent { border-color: var(--accent-color) !important; }
    .hover\:bg-accent-hover:hover { background-color: var(--accent-hover) !important; }
    body.dark-mode { background-color: #000000; color: #ffffff; }
    body.dark-mode .bg-white { background-color: #0a0a0a !important; }
    body.dark-mode .bg-gray-50 { background-color: #141414 !important; }
    body.dark-mode .bg-gray-100 { background-color: #222222 !important; }
    body.dark-mode .border-gray-100, body.dark-mode .border-gray-200, body.dark-mode .border-gray-300 { border-color: #222222 !important; }
    body.dark-mode .text-gray-900, body.dark-mode .text-gray-800, body.dark-mode .text-black { color: #ffffff !important; }
    body.dark-mode .text-gray-700, body.dark-mode .text-gray-600, body.dark-mode .text-gray-500 { color: #888888 !important; }
    body.dark-mode .text-gray-400 { color: #666666 !important; }
    body.dark-mode .bg-accent { background-color: #ffffff !important; color: #000000 !important; }
    body.dark-mode .bg-accent.text-white { color: #000000 !important; }
    body.dark-mode .bg-accent.text-white svg { color: #000000 !important; stroke: #000000 !important; }
    body.dark-mode button[onclick="goBack()"] { background-color: #000000 !important; border: 1.5px solid rgba(255,255,255,0.4) !important; color: #ffffff !important; }
    body.dark-mode button[onclick="goBack()"]:hover { background-color: #1a1a1a !important; border-color: rgba(255,255,255,0.7) !important; }
    body.dark-mode button[onclick="goBack()"] svg { color: #ffffff !important; stroke: #ffffff !important; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body.dark-mode #cta-bar-bg { background-image: linear-gradient(to top, #000000 0%, rgba(0,0,0,0.9) 60%, transparent 100%); }
    textarea:focus { outline: none!important; box-shadow: none!important; }
</style>
</head>
<body class="min-h-screen flex flex-col text-gray-900 pt-20">
<script>(function(){try{var t=localStorage.getItem('clinqoo_theme')||'Sistem (Default)';var d=(t==='Gelap')||(t==='Sistem (Default)'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.body.classList.add('dark-mode');var a=localStorage.getItem('clinqoo_accent')||'Hitam (Default)';var am={'Hitam (Default)':{m:'#000000',h:'#1f2937'},'Biru':{m:'#2563eb',h:'#1d4ed8'},'Hijau':{m:'#059669',h:'#047857'},'Ungu':{m:'#9333ea',h:'#7e22ce'},'Merah':{m:'#dc2626',h:'#b91c1c'}};var c=am[a]||am['Hitam (Default)'];document.documentElement.style.setProperty('--accent-color',c.m);document.documentElement.style.setProperty('--accent-hover',c.h);}catch(e){}})();</script>

<main class="flex-1 w-full max-w-2xl mx-auto pb-32 flex-col justify-start relative">
    <!-- Header -->
    <button onclick="goBack()" class="fixed top-3 left-3 w-10 h-10 flex items-center justify-center rounded-full bg-white backdrop-blur border border-gray-100 shadow-sm hover:bg-gray-50 transition-all cursor-pointer text-gray-700 hover:text-black z-50" aria-label="Kembali">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <div class="flex flex-col px-7 pb-4 relative">
        <h2 class="text-[24px] font-extrabold text-gray-900 tracking-tight">Verifikasi Domain</h2>
        <p id="v-domain" class="text-[14px] text-gray-500 font-medium mt-0.5">memuat…</p>
    </div>

    <!-- Panel: Record DNS (flat list) -->
    <div class="px-7">
        <h3 class="text-[12px] font-bold text-gray-400 uppercase tracking-wider mt-6">Tambahkan Record TXT</h3>
        <p class="text-[13px] text-gray-500 leading-relaxed mt-1.5">Masuk ke pengaturan DNS penyedia domain-mu, lalu tambahkan record berikut:</p>
        <div class="mt-1">
            <div class="flex items-center justify-between gap-3 py-3 border-b border-gray-100">
                <div class="min-w-0">
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Tipe</p>
                    <p class="mono text-[13px] font-semibold text-gray-900 mt-0.5">TXT</p>
                </div>
            </div>
            <div class="flex items-center justify-between gap-3 py-3 border-b border-gray-100">
                <div class="min-w-0">
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Nama / Host</p>
                    <p class="mono text-[13px] font-semibold text-gray-900 mt-0.5 truncate" id="txt-name">_clincoo-challenge</p>
                </div>
                <button onclick="copyText('txt-name')" class="w-8 h-8 rounded-full hover:bg-gray-100 transition-colors flex items-center justify-center cursor-pointer shrink-0" title="Salin"><i data-lucide="copy" class="w-4 h-4 text-gray-400"></i></button>
            </div>
            <div class="flex items-center justify-between gap-3 py-3 border-b border-gray-100">
                <div class="min-w-0">
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Nilai</p>
                    <p class="mono text-[13px] font-semibold text-gray-900 mt-0.5 truncate" id="txt-value">clincoo-verify=</p>
                </div>
                <button onclick="copyText('txt-value')" class="w-8 h-8 rounded-full hover:bg-gray-100 transition-colors flex items-center justify-center cursor-pointer shrink-0" title="Salin"><i data-lucide="copy" class="w-4 h-4 text-gray-400"></i></button>
            </div>
            <div class="flex items-center justify-between gap-3 py-3 border-b border-gray-100">
                <div class="min-w-0">
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">TTL</p>
                    <p class="text-[13px] font-semibold text-gray-900 mt-0.5">Otomatis (atau 3600)</p>
                </div>
            </div>
        </div>
        <p class="text-[12px] text-gray-500 leading-relaxed mt-3">Record TXT boleh dihapus setelah verifikasi selesai.</p>
    </div>

    <!-- CTA Konfirmasi -->
    <div class="fixed bottom-0 inset-x-0 z-40 pointer-events-none">
        <div id="cta-bar-bg" class="max-w-2xl mx-auto px-5 pb-5 pt-8 bg-gradient-to-t from-white via-white/90 to-transparent pointer-events-auto">
            <button id="cta-done" onclick="finish()" class="w-full bg-accent text-white rounded-full py-3 text-[15px] font-bold hover:bg-accent-hover transition-all active:scale-[0.98] cursor-pointer shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                <span id="cta-label">Konfirmasi</span>
            </button>
        </div>
    </div>
</main>

<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm font-medium rounded-full px-4 py-2 shadow-lg z-[70] transition-all"></div>

<script>
const KEY = 'clincoo_exp_domains';
const params = new URLSearchParams(location.search);
const domain = (params.get('domain') || '').toLowerCase();

function goBack() { if (history.length > 1) history.back(); else location.href = '../'; }
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.add('hidden'), 2200);
}
function copyValue(txt) {
    navigator.clipboard.writeText(txt).then(() => showToast('Disalin: ' + txt)).catch(() => {});
}
function copyText(id) { copyValue(document.getElementById(id).textContent.trim()); }

function finish() {
    let list = [];
    try { list = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) {}
    const now = new Date().toISOString();
    if (!list.some(d => d.name === domain)) {
        list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,7), name: domain, note: '', status: 'aktif', created: now });
        localStorage.setItem(KEY, JSON.stringify(list));
    } else {
        list.forEach(d => { if (d.name === domain) d.status = 'aktif'; });
        localStorage.setItem(KEY, JSON.stringify(list));
    }
    location.href = '../';
}

/* Init */
if (!domain) { location.replace('../'); }
else {
    document.getElementById('v-domain').textContent = domain;
    document.getElementById('txt-name').textContent = '_clincoo-challenge.' + domain;
    document.getElementById('txt-value').textContent = 'clincoo-verify=' + btoa(domain + Date.now()).replace(/[^a-zA-Z0-9]/g, '').slice(0, 24).toLowerCase();
}
lucide.createIcons();
</script>
</body>
</html>
